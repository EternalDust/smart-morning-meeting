server:
  port: 8086

spring:
  application:
    name: smart-morning-meeting-backend
  
  # Redis 缓存集群配置 (此处以单机做示例，部署时改为cluster)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/smart_meeting?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  global-config:
    db-config:
      id-type: auto

# 大模型复盘报告配置 (智谱 GLM 等 OpenAI 兼容接口)
# GLM-4.7-Flash 为推理模型，reasoning_content 会占用 max-tokens，故给足预算
ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    model: ${AI_LLM_MODEL:GLM-4.7-Flash}
    api-key: ${AI_LLM_API_KEY:3c75c432311e441f8dd1e4033689b67b.YNUUZLNOk6MclCVY}
    connect-timeout-seconds: 10
    read-timeout-seconds: 60
    temperature: 0.7
    max-tokens: 3000
    max-retry: 3
