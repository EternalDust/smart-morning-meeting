server:
  port: 8086

spring:
  application:
    name: smart-morning-meeting-backend
  
  # Redis 缓存集群配置 (此处以单机做示例，部署时改为cluster)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/smart_meeting?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  global-config:
    db-config:
      id-type: auto

# 大模型复盘报告配置 (DeepSeek 等 OpenAI 兼容接口)
ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://api.deepseek.com}
    model: ${AI_LLM_MODEL:deepseek-v4-flash}
    api-key: ${AI_LLM_API_KEY:sk-2b28173e62994a95acf0000de7025620}
    connect-timeout-seconds: 10
    read-timeout-seconds: 60
    temperature: 0.7
    max-tokens: 1500
    max-retry: 3
