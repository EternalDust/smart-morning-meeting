apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: smart-approval-manage
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: smart-approval-manage
    template:
      metadata:
        labels:
          app: smart-approval-manage
      spec:
        containers:
          - name: app
            image: smart-approval-manage:latest
            ports:
              - containerPort: 8080
            env:
              - name: SPRING_PROFILES_ACTIVE
                value: "prod"
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: smart-approval-manage-svc
  spec:
    selector:
      app: smart-approval-manage
    ports:
      - port: 8080
        targetPort: 8080
    type: ClusterIP